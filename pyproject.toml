[project]
name = "farq"
version = "0.1.0"
description = "FARQ: check a suspicious financial video before acting on it"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
farq = "farq.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farq"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]  # generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_models: runs a real model (downloads it on first use); deselect with -m 'not real_models'",
]
